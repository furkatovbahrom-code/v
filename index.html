<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Ruscha So‘z Yodlash</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b);
min-height:100vh;
padding:20px;
color:white;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
font-size:34px;
margin-bottom:8px;
}

.header p{
opacity:.8;
}

.card{
background:white;
color:#111827;
border-radius:28px;
padding:22px;
box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.top{
display:flex;
justify-content:space-between;
font-weight:bold;
margin-bottom:16px;
}

.progress{
width:100%;
height:12px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-bottom:20px;
}

.progressFill{
height:100%;
width:0%;
background:linear-gradient(to right,#22c55e,#16a34a);
transition:.3s;
}

.mode{
background:#e2e8f0;
padding:12px;
border-radius:16px;
text-align:center;
font-weight:bold;
margin-bottom:20px;
}

.question{
font-size:32px;
font-weight:bold;
text-align:center;
margin-bottom:25px;
}

.answers{
display:flex;
flex-direction:column;
gap:12px;
}

.option{
border:none;
padding:18px;
border-radius:18px;
background:#f1f5f9;
cursor:pointer;
font-size:18px;
font-weight:bold;
transition:.2s;
}

.option:hover{
transform:scale(1.02);
}

.correct{
background:#22c55e !important;
color:white;
}

.wrong{
background:#ef4444 !important;
color:white;
}

.inputBox{
display:none;
margin-top:10px;
}

input{
width:100%;
padding:18px;
font-size:20px;
border-radius:16px;
border:2px solid #cbd5e1;
margin-bottom:12px;
}

.btn{
border:none;
background:#2563eb;
color:white;
width:100%;
padding:16px;
font-size:18px;
border-radius:16px;
cursor:pointer;
font-weight:bold;
}

.btn:hover{
opacity:.92;
}

.result{
text-align:center;
font-size:22px;
font-weight:bold;
margin-top:15px;
min-height:35px;
}

.nextBtn{
margin-top:15px;
}

.finish{
text-align:center;
}

.finish h2{
font-size:36px;
margin-bottom:10px;
}

.finish p{
font-size:24px;
margin-bottom:15px;
}

@media(max-width:600px){
.question{
font-size:26px;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>🇷🇺 Ruscha So‘z Yodlash</h1>
<p>14 ta so‘z + 42 ta misol</p>
</div>

<div class="card" id="app">

<div class="top">
<div id="progressText">1 / 56</div>
<div id="scoreText">Ball: 0</div>
</div>

<div class="progress">
<div class="progressFill" id="progressFill"></div>
</div>

<div class="mode" id="modeText">
Ruscha → O‘zbekcha
</div>

<div class="question" id="question">
Как
</div>

<div class="answers" id="answers"></div>

<div class="inputBox" id="inputBox">

<input
id="answerInput"
type="text"
placeholder="Ruschasini yozing..."
>

<button class="btn" onclick="checkTyping()">
Tekshirish
</button>

</div>

<div class="result" id="result"></div>

<button class="btn nextBtn" onclick="nextQuestion()">
Keyingi →
</button>

</div>

</div>

let quiz = [];
let currentIndex = 0;
let score = 0;
let currentAnswer = "";
let answered = false;

function shuffle(arr){
return arr.sort(() => Math.random() - 0.5);
}

function randomWrongAnswers(correct){
const pool = words
.map(w=>w.uz)
.filter(x=>x!==correct);

return shuffle(pool).slice(0,2);
}

function buildQuiz(){

words.forEach(word=>{

quiz.push({
type:"choice",
mode:"Ruscha → O‘zbekcha",
question:word.ru,
answer:word.uz,
options:shuffle([
word.uz,
...randomWrongAnswers(word.uz)
])
});

quiz.push({
type:"typing",
mode:"O‘zbekcha → Ruscha",
question:word.uz,
answer:word.ru
});

word.examples.forEach(ex=>{

const wrong = shuffle(
words
.flatMap(w=>w.examples.map(e=>e[1]))
.filter(x=>x!==ex[1])
).slice(0,2);

quiz.push({
type:"choice",
mode:"Misol tarjima",
question:ex[0],
answer:ex[1],
options:shuffle([
ex[1],
...wrong
])
});

});

});

quiz = shuffle(quiz);

}
function renderQuestion(){

answered = false;

const q = quiz[currentIndex];

document.getElementById("question").innerText =
q.question;

document.getElementById("modeText").innerText =
q.mode;

document.getElementById("result").innerText = "";

document.getElementById("progressText").innerText =
(currentIndex + 1) + " / " + quiz.length;

document.getElementById("scoreText").innerText =
"Ball: " + score;

document.getElementById("progressFill").style.width =
((currentIndex + 1) / quiz.length * 100) + "%";

const answersDiv =
document.getElementById("answers");

answersDiv.innerHTML = "";

document.getElementById("inputBox")
.style.display = "none";

if(q.type === "choice"){

q.options.forEach(option=>{

const btn =
document.createElement("button");

btn.className = "option";

btn.innerText = option;

btn.onclick = () =>
checkAnswer(option, btn);

answersDiv.appendChild(btn);

});

}else{

document.getElementById("inputBox")
.style.display = "block";

document.getElementById("answerInput")
.value = "";

}

currentAnswer = q.answer;

}

function checkAnswer(selected, btn){

if(answered) return;

answered = true;

const result =
document.getElementById("result");

const buttons =
document.querySelectorAll(".option");

buttons.forEach(b=>{

if(
b.innerText === currentAnswer
){
b.classList.add("correct");
}

});

if(selected === currentAnswer){

score++;

btn.classList.add("correct");

result.innerText =
"✅ To‘g‘ri";

}else{

btn.classList.add("wrong");

result.innerText =
"❌ To‘g‘ri javob: "
+ currentAnswer;

}

document.getElementById("scoreText")
.innerText =
"Ball: " + score;

}

function checkTyping(){

if(answered) return;

answered = true;

const input =
document.getElementById(
"answerInput"
).value.trim().toLowerCase();

const result =
document.getElementById("result");

if(
input ===
currentAnswer.toLowerCase()
){

score++;

result.innerText =
"✅ To‘g‘ri";

}else{

result.innerText =
"❌ To‘g‘ri javob: "
+ currentAnswer;

}

document.getElementById("scoreText")
.innerText =
"Ball: " + score;

}

function nextQuestion(){

if(currentIndex < quiz.length - 1){

currentIndex++;

renderQuestion();

}else{

document.getElementById("app")
.innerHTML = `
<div class="finish">
<h2>🎉 Tugadi</h2>

<p>
Natija:
<b>${score}</b>
/
<b>${quiz.length}</b>
</p>

<button
class="btn"
onclick="location.reload()"
>
Qayta boshlash
</button>

</div>
`;

}

}

buildQuiz();
renderQuestion();

</script>

</html>
